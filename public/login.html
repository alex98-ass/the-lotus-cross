<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — The Lotus Cross</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap');
:root{--bg:#0a0a0f;--bg2:#121119;--card:rgba(255,255,255,0.03);--gold:#c9a227;--gold-light:#e8c856;--purple:#7b6ba8;--text:#e8e6e3;--muted:#9b9b9b;--border:rgba(201,162,39,0.15);--red:#c94a4a;--green:#4a9d7f}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;background:radial-gradient(ellipse at 50% 20%,rgba(123,107,168,.08) 0%,transparent 60%)}
.auth-wrap{width:100%;max-width:420px}
.auth-card{background:var(--bg2);border:1px solid var(--border);padding:3rem 2.5rem;border-radius:4px}
.auth-logo{text-align:center;font-family:'Cormorant Garamond',serif;font-size:1.8rem;color:var(--gold);margin-bottom:.5rem;letter-spacing:1px}
.auth-sub{text-align:center;color:var(--muted);font-size:.9rem;font-style:italic;font-family:'Cormorant Garamond',serif;margin-bottom:2.5rem}
.form-group{margin-bottom:1.5rem}
.form-group label{display:block;font-size:.75rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--gold);margin-bottom:.6rem}
.form-group input{width:100%;background:rgba(0,0,0,.3);border:1px solid var(--border);color:var(--text);padding:.9rem 1rem;font-family:'Inter',sans-serif;font-size:.95rem;border-radius:2px;transition:border-color .3s}
.form-group input:focus{outline:none;border-color:var(--gold)}
.btn{width:100%;background:var(--gold);color:#000;padding:1rem;border:none;border-radius:2px;font-size:.9rem;font-weight:600;text-transform:uppercase;letter-spacing:2px;cursor:pointer;transition:all .3s;font-family:'Inter',sans-serif}
.btn:hover{background:var(--gold-light);transform:translateY(-2px)}
.btn-secondary{background:transparent;border:1px solid var(--border);color:var(--text);margin-top:.8rem}
.btn-secondary:hover{background:transparent;border-color:var(--gold);color:var(--gold);transform:none}
.msg{display:none;padding:1rem;border-radius:2px;margin-bottom:1.5rem;font-size:.85rem;text-align:center}
.msg.error{display:block;background:rgba(201,74,74,.1);border:1px solid rgba(201,74,74,.3);color:var(--red)}
.msg.success{display:block;background:rgba(74,157,127,.1);border:1px solid rgba(74,157,127,.3);color:var(--green)}
.auth-links{text-align:center;margin-top:1.5rem;font-size:.85rem;color:var(--muted)}
.auth-links a{color:var(--gold);text-decoration:none}
.auth-links a:hover{text-decoration:underline}
.back-link{display:block;text-align:center;margin-top:1.5rem;color:var(--muted);text-decoration:none;font-size:.8rem}
.back-link:hover{color:var(--gold)}
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">✦ The Lotus Cross</div>
    <div class="auth-sub">Sign in to continue your journey</div>
    <div id="msg" class="msg"></div>
    <form id="loginForm" onsubmit="return doLogin(event)">
      <div class="form-group"><label>Email</label><input type="email" id="email" required placeholder="you@email.com"></div>
      <div class="form-group"><label>Password</label><input type="password" id="password" required placeholder="Your password"></div>
      <button type="submit" class="btn">Sign In</button>
    </form>
    <button class="btn btn-secondary" onclick="showSetPassword()">First time? Set your password</button>
    <div class="auth-links"><a href="index.html">← Back to main site</a></div>
  </div>
</div>

<script>
// If you are already signed in, do not ask again.
(function(){
  var t = localStorage.getItem('lotus_token');
  if(!t) return;
  fetch('/api/me',{headers:{'Authorization':'Bearer '+t}})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(d){
      if(d && d.user){ window.location.href = (d.user.role==='admin' ? 'admin.html' : 'portal.html'); }
      else { localStorage.removeItem('lotus_token'); localStorage.removeItem('lotus_user'); }
    })
    .catch(function(){});
})();
</script>
<script>
function showMsg(text, type){
  var m=document.getElementById('msg');
  m.className='msg '+type;
  m.textContent=text;
}
function doLogin(e){
  e.preventDefault();
  var email=document.getElementById('email').value;
  var password=document.getElementById('password').value;
  fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})})
    .then(r=>r.json().then(d=>({ok:r.ok,d})))
    .then(({ok,d})=>{
      if(!ok){showMsg(d.error||'Login failed','error');return;}
      localStorage.setItem('lotus_token',d.token);
      localStorage.setItem('lotus_user',JSON.stringify(d.user));
      if(d.user.role==='admin'){window.location.href='admin.html';}
      else{window.location.href='portal.html';}
    })
    .catch(()=>showMsg('Network error. Is the server running?','error'));
  return false;
}
function showSetPassword(){
  var email=prompt('Enter your email and we will send you a secure link:');
  if(!email)return;
  fetch('/api/request-reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})})
    .then(r=>r.json().then(d=>({ok:r.ok,d})))
    .then(({ok,d})=>{
      showMsg(ok?(d.message||'Check your email.'):(d.error||'Error'), ok?'success':'error');
    })
    .catch(()=>showMsg('Network error','error'));
}
</script>
</body>
</html>
